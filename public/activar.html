<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activa tu línea PandaMóvil</title>
<style>
  :root {
    --panda-black: #1a1a1a;
    --panda-white: #ffffff;
    --panda-accent: #e63946;
    --panda-gray: #f2f2f2;
    --panda-green: #2a9d5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--panda-gray);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--panda-white);
    border-radius: 20px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  h1 { font-size: 22px; color: var(--panda-black); text-align: center; margin-bottom: 4px; }
  p.subtitle { color: #666; font-size: 14px; text-align: center; margin-bottom: 20px; }
  .badge-ref {
    background: #fff3f3;
    border: 1.5px solid var(--panda-accent);
    color: var(--panda-accent);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 20px;
  }
  .badge-ref.sin-ref {
    background: #f5f5f5;
    border-color: #ccc;
    color: #888;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--panda-black);
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--panda-accent); }
  button {
    width: 100%;
    padding: 14px;
    background: var(--panda-accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #mensaje {
    display: none;
    text-align: center;
    padding: 16px;
    border-radius: 10px;
    margin-top: 16px;
    font-size: 14px;
    font-weight: 600;
  }
  #mensaje.exito { background: #eafaf0; color: var(--panda-green); display: block; }
  #mensaje.error { background: #fdecec; color: var(--panda-accent); display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>🐼 Activa tu línea</h1>
  <p class="subtitle">Completa tus datos y activa tu plan PandaMóvil.</p>

  <div id="badge-container"></div>

  <form id="form-activacion">
    <label for="plan">Plan</label>
    <select id="plan" required>
      <option value="">Selecciona tu plan</option>
      <option value="Mi Panda Mini Pro">Mi Panda Mini Pro — 2GB — $109</option>
      <option value="Mi Panda Full">Mi Panda Full — 4GB — $149</option>
      <option value="Mi Panda Max">Mi Panda Max — 12GB — $199</option>
      <option value="Mi Panda Premium">Mi Panda Premium — 24GB — $249</option>
      <option value="Mi Panda Pro Max">Mi Panda Pro Max — 35GB — $310</option>
    </select>

    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" placeholder="Tu nombre" required>

    <label for="telefono">Número a activar</label>
    <input type="tel" id="telefono" placeholder="10 dígitos" required pattern="[0-9]{10}">

    <button type="submit" id="btn-activar">Activar mi línea</button>
  </form>

  <div id="mensaje"></div>
</div>

<script>
  // ⚙️ CONFIGURACIÓN: endpoint de la función serverless en Netlify.
  // Si publicas en tu propio dominio, usa ruta relativa "/api/activar" (recomendado).
  // Si necesitas la URL completa (ej. para pruebas), usa: https://TU-SITIO.netlify.app/api/activar
  const ENDPOINT_BACKEND = "/api/activar";

  // 1. Capturar el código de referido de la URL (?ref=CODIGO)
  const params = new URLSearchParams(window.location.search);
  const refCode = params.get('ref');

  const badgeContainer = document.getElementById('badge-container');
  if (refCode) {
    badgeContainer.innerHTML = `<div class="badge-ref">Te está refiriendo: <strong>${refCode}</strong></div>`;
  } else {
    badgeContainer.innerHTML = `<div class="badge-ref sin-ref">Activación directa (sin referido)</div>`;
  }

  const form = document.getElementById('form-activacion');
  const btnActivar = document.getElementById('btn-activar');
  const mensaje = document.getElementById('mensaje');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    btnActivar.disabled = true;
    btnActivar.textContent = 'Activando...';
    mensaje.style.display = 'none';

    const datos = {
      nombre: document.getElementById('nombre').value,
      telefono: document.getElementById('telefono').value,
      plan: document.getElementById('plan').value,
      referido_de: refCode || 'directo',
      fecha: new Date().toISOString()
    };

    try {
      // Envío al backend (Netlify Function → guarda en Netlify Blobs)
      const respuesta = await fetch(ENDPOINT_BACKEND, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });

      if (!respuesta.ok) throw new Error('Respuesta no válida del servidor');
      const resultado = await respuesta.json();

      mensaje.className = 'exito';
      mensaje.textContent = resultado.linea_gratis_ganada
        ? '¡Listo! Tu línea fue registrada. 🎉 Además, el negocio que te refirió acaba de ganar su línea PandaMóvil gratis de por vida.'
        : '¡Listo! Tu línea fue registrada. Te contactaremos para completar la activación.';
      mensaje.style.display = 'block';
      form.reset();

    } catch (error) {
      mensaje.className = 'error';
      mensaje.textContent = 'Hubo un problema al activar. Intenta de nuevo o contáctanos directo.';
      mensaje.style.display = 'block';
      console.error(error);
    } finally {
      btnActivar.disabled = false;
      btnActivar.textContent = 'Activar mi línea';
    }
  });
</script>

</body>
</html>
